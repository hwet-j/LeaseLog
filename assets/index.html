<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>월세 관리</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#1d2733;--sub:#6b7480;--line:#e6e3da;--pri:#1b6b5a;--pri-d:#14513f;--pri-l:#e2f0eb;--red:#c23b2e;--red-l:#fbe8e5;--amb:#a96a0c;--amb-l:#fdf1d6;--blue:#2b6cb0;--blue-l:#e5eef8;--gray-l:#ebe9e2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column}
header.top{flex:none;display:flex;align-items:center;gap:4px;padding:10px 12px 6px;min-height:58px}
header.top .t{flex:1;min-width:0}
header.top h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .s{font-size:12.5px;color:var(--sub)}
.ib{border:0;background:transparent;min-width:40px;height:40px;border-radius:12px;font-size:15px;color:var(--ink);padding:0 8px;font-weight:600}
.ib:active{background:var(--gray-l)}
.ib.sm{min-width:32px;height:32px;color:var(--sub);font-size:18px}
.ib.txt{color:var(--pri);font-weight:700}
main{flex:1;overflow-y:auto;padding:2px 14px 96px;-webkit-overflow-scrolling:touch}
nav.tabs{flex:none;display:flex;background:#fff;border-top:1px solid var(--line)}
nav.tabs button{flex:1;border:0;background:none;padding:8px 0 7px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--pri);font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.card.flat{padding:4px 14px}
h2{font-size:15px;margin:20px 2px 6px;display:flex;align-items:center;gap:8px;font-weight:800}
h3{font-size:18px;margin:0 0 4px}
.h{font-weight:800;font-size:15.5px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sub{color:var(--sub);font-size:13px}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.card .row:first-of-type,.card.flat .row:first-child{border-top:0}
.row.tap,.rcard.tap,.tap{cursor:pointer}
.row.tap:active,.rcard.tap:active{background:#faf9f5}
.r{text-align:right;flex:none}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.c-paid{background:var(--pri-l);color:var(--pri-d)}
.c-late{background:var(--red-l);color:var(--red)}
.c-part{background:var(--amb-l);color:var(--amb)}
.c-wait{background:var(--gray-l);color:var(--sub)}
.c-vac{background:var(--blue-l);color:var(--blue)}
.c-act{background:var(--pri-l);color:var(--pri-d)}
.c-end{background:var(--gray-l);color:var(--sub)}
.big{font-size:27px;font-weight:800;letter-spacing:-.5px;margin:2px 0 8px}
.big span{font-size:14px;color:var(--sub);font-weight:600}
.bar{height:9px;background:var(--gray-l);border-radius:99px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px}
.rcard{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0}
.rname{min-width:58px;padding:10px 6px;text-align:center;font-weight:800;font-size:16px;background:var(--pri-l);color:var(--pri-d);border-radius:12px}
.rname.vac{background:var(--blue-l);color:var(--blue)}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--pri-l);color:var(--pri-d);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.big2{font-size:30px;font-weight:800;letter-spacing:-.5px}
.kv{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv>span:first-child{flex:none;width:78px;color:var(--sub);font-size:13.5px}
.kv>span:last-child,.kv>div:last-child{flex:1;min-width:0;word-break:break-word}
.btns{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;border:0;background:var(--pri);color:#fff;font-weight:700;border-radius:12px;padding:12px 10px;min-height:46px;font-size:15px}
.btn:active{background:var(--pri-d)}
.btn.ghost{background:var(--gray-l);color:var(--ink)}
.btn.dng{background:var(--red-l);color:var(--red);flex:none}
.btn.sm{flex:none;min-height:36px;padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.4}
.btn.line{background:#fff;color:var(--pri);border:1.5px solid var(--pri)}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.empty{color:var(--sub);text-align:center;padding:18px 8px;font-size:14px}
.fab{position:fixed;right:16px;bottom:76px;border:0;background:var(--pri);color:#fff;border-radius:99px;min-height:50px;padding:0 20px;font-weight:800;font-size:15px;box-shadow:0 6px 18px rgba(20,60,50,.28);z-index:5}
.fab:active{background:var(--pri-d)}
.note{display:flex;gap:8px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.note .tx{white-space:pre-wrap;word-break:break-word}
.addnote{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
.addnote textarea{flex:1}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;min-height:46px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
textarea{resize:none;min-height:46px}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--pri)}
.fl{display:block;margin:12px 0 0}
.fl>span{display:block;font-size:13px;color:var(--sub);margin-bottom:5px;font-weight:600}
.fl>span em{color:var(--red);font-style:normal}
.fl.chk{display:flex;align-items:center;gap:10px;margin-top:14px}
.fl.chk>span{margin:0;color:var(--ink);font-size:15px}
.fl .hint{font-size:12px;color:var(--sub);margin-top:4px}
.hidden{display:none!important}
.sheet-bg{position:fixed;inset:0;background:rgba(18,24,30,.5);display:flex;align-items:flex-end;z-index:50}
.sheet{background:#fff;width:100%;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 16px 22px;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:rgba(29,39,51,.94);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:99;max-width:86%;text-align:center}
.search{margin:6px 0 4px}
.banner{background:var(--amb-l);color:#6b4306;border-radius:14px;padding:12px 14px;margin:10px 0;font-size:14px}
.steps{margin:6px 0 12px;padding-left:20px;line-height:1.9}
.menu .row{padding:15px 0}
.menu .row b{font-size:16px}
.mb{display:flex;align-items:center;gap:10px;padding:5px 0}
.mb .lb{flex:none;width:44px;font-size:13px;color:var(--sub)}
.mb .tr{flex:1;height:14px;background:var(--gray-l);border-radius:99px;overflow:hidden}
.mb .tr i{display:block;height:100%;background:var(--pri);border-radius:99px}
.mb .vl{flex:none;width:92px;text-align:right;font-size:13.5px;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;margin:8px 0}
.seg button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:8px 4px;font-weight:700;color:var(--sub);font-size:14px}
.seg button.on{border-color:var(--pri);background:var(--pri-l);color:var(--pri-d)}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:6px 0}
.mnav b{font-size:19px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
var A = window.Android;
var KEY = 'rentapp.v1';

/* ───────── 데이터 ───────── */
function blank(){ return {props:[],rooms:[],tenants:[],contracts:[],payments:[],meta:{lastBackup:null,created:new Date().toISOString()}}; }
function load(){
  try{ var s=localStorage.getItem(KEY); if(s){ var d=JSON.parse(s); return Object.assign(blank(),d); } }catch(e){}
  return blank();
}
var db = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast('저장에 실패했어요'); } }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function byId(arr,id){ for(var i=0;i<arr.length;i++) if(arr[i].id===id) return arr[i]; return null; }

/* ───────── 유틸 ───────── */
function pad(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function today(){ return ymd(new Date()); }
function pd(s){ return new Date(s+'T00:00:00'); }
function diff(a,b){ return Math.round((pd(b)-pd(a))/864e5); }
function addM(ym,n){ var p=ym.split('-').map(Number); var m=p[1]-1+n; var y=p[0]+Math.floor(m/12); m=((m%12)+12)%12; return y+'-'+pad(m+1); }
function addD(s,n){ var d=pd(s); d.setDate(d.getDate()+n); return ymd(d); }
function yearLater(s){ var d=pd(s); d.setFullYear(d.getFullYear()+1); d.setDate(d.getDate()-1); return ymd(d); }
function dueOf(c,ym){ var p=ym.split('-').map(Number); var last=new Date(p[0],p[1],0).getDate(); return ym+'-'+pad(Math.min(Number(c.payDay)||1,last)); }
function n0(v){ return Number(v)||0; }
function won(n){ return n0(n).toLocaleString('ko-KR')+'원'; }
function man(n){ n=n0(n); if(n && n%10000===0) return (n/10000).toLocaleString('ko-KR')+'만원'; return won(n); }
function kd(s){ return s? s.replace(/-/g,'.') : ''; }
function kds(s){ if(!s) return ''; var p=s.split('-'); return Number(p[1])+'/'+Number(p[2]); }
function ymLabel(ym){ var p=ym.split('-'); return p[0]+'년 '+Number(p[1])+'월'; }
function dayLabel(s){ var d=pd(s); return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+'일월화수목금토'[d.getDay()]+')'; }
function dday(s){ var n=diff(today(),s); if(n>0) return 'D-'+n; if(n===0) return 'D-Day'; return Math.abs(n)+'일 지남'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function nl(s){ return esc(s).replace(/\n/g,'<br>'); }
function digits(s){ return String(s||'').replace(/\D/g,''); }
function fmtPhone(s){
  var d=digits(s).slice(0,11);
  if(d.indexOf('02')===0){ d=d.slice(0,10); var r=d.slice(2); if(r.length<=4) return d.length<=2? d : '02-'+r; return '02-'+r.slice(0,r.length-4)+'-'+r.slice(-4); }
  if(d.length<=3) return d;
  if(d.length<=7) return d.slice(0,3)+'-'+d.slice(3);
  if(d.length<=10) return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);
  return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);
}
function natcmp(a,b){ return String(a).localeCompare(String(b),'ko',{numeric:true}); }
var toastT;
function toast(m){
  var old=document.querySelector('.toast'); if(old) old.remove();
  var t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t);
  clearTimeout(toastT); toastT=setTimeout(function(){ t.remove(); },2200);
}
function openUri(u){ if(A&&A.openUri) A.openUri(u); else window.open(u,'_blank'); }
function copyText(t){
  if(A&&A.copy){ A.copy(t); return true; }
  try{ var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); var ok=document.execCommand('copy'); ta.remove(); return ok; }catch(e){ return false; }
}

/* ───────── 계산 ───────── */
function activeOf(roomId){ return db.contracts.filter(function(c){return c.roomId===roomId && c.status==='active';})[0]||null; }
function limitOf(c){ return c.status==='active' ? c.end : (c.endedOn||c.end); }
function allMonths(c){
  var out=[]; var lim=limitOf(c); if(!c.start||!lim) return out;
  var ym=c.start.slice(0,7);
  for(var i=0;i<600;i++){ var d=dueOf(c,ym); if(d>lim) break; if(d>=c.start) out.push(ym); ym=addM(ym,1); }
  return out;
}
function visibleMonths(c){
  var t=today(), cur=t.slice(0,7);
  return allMonths(c).filter(function(ym){ return ym<=cur || diff(t,dueOf(c,ym))<=7; });
}
function termsAt(c,ym){
  var t={rent:n0(c.rent),fee:n0(c.fee)};
  (c.changes||[]).slice().sort(function(a,b){return a.from<b.from?-1:1;}).forEach(function(x){ if(x.from<=ym){ t.rent=n0(x.rent); t.fee=n0(x.fee); } });
  return t;
}
function curTerms(c){ return termsAt(c,today().slice(0,7)); }
function lastTerms(c){ return termsAt(c,'9999-12'); }
function payFor(c,ym){ return db.payments.filter(function(p){return p.contractId===c.id && p.ym===ym;}).sort(function(a,b){return a.paidOn<b.paidOn?-1:1;}); }
function paidSum(c,ym){ return payFor(c,ym).reduce(function(s,p){return s+n0(p.amount);},0); }
function mstat(c,ym){
  var tm=termsAt(c,ym), due=tm.rent+tm.fee, paid=paidSum(c,ym), d=dueOf(c,ym), days=diff(d,today());
  var o={rent:tm.rent,fee:tm.fee,due:due,paid:paid,dd:d,days:days,remain:Math.max(0,due-paid)};
  if(paid>=due){ o.k='paid'; o.l='완납'; }
  else if(days>0){ if(paid>0){o.k='part';o.l='일부납부 · '+days+'일';} else {o.k='late';o.l='미납 '+days+'일';} }
  else { if(paid>0){o.k='part';o.l='일부납부';} else {o.k='wait'; o.l= days===0?'오늘 납부일':'D'+days;} }
  return o;
}
function arrears(){
  var out=[];
  db.contracts.forEach(function(c){ allMonths(c).forEach(function(ym){ var s=mstat(c,ym); if(s.k!=='paid' && s.days>0) out.push({c:c,ym:ym,s:s}); }); });
  out.sort(function(a,b){ return a.s.dd<b.s.dd?-1:1; });
  return out;
}
function roomLabel(c){ var r=byId(db.rooms,c.roomId); var p=r&&byId(db.props,r.propId); return (db.props.length>1&&p? p.name+' ':'')+(r?r.name:'(삭제된 호실)'); }

/* ───────── 화면 상태 ───────── */
var nav={tab:'home',stack:[]};
var pf={ym:today().slice(0,7),filter:'all',year:new Date().getFullYear()};
var modals=[];
var app=document.getElementById('app');

var ICON={
 home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>',
 rooms:'<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2"/><path d="M10 21v-4h4v4"/></svg>',
 ppl:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.8-3.8 3.6-5.6 7.5-5.6s6.7 1.8 7.5 5.6"/></svg>',
 pay:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M7 15h3"/></svg>',
 more:'<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>'
};
var TABS=[['home','홈','home'],['rooms','호실','rooms'],['tenants','세입자','ppl'],['pay','납부','pay'],['more','더보기','more']];

function go(s){ nav.stack.push(s); render(true); }
function setTab(t){ nav.tab=t; nav.stack=[]; render(true); }

function render(reset){
  var prev=document.getElementById('main'); var st=prev&&!reset? prev.scrollTop:0;
  var top=nav.stack[nav.stack.length-1];
  var title='',sub='',body='',right='',fab='';
  if(top){
    if(top.t==='room'){ var r=byId(db.rooms,top.id); if(!r){nav.stack.pop(); return render(true);} title=r.name; sub=(byId(db.props,r.propId)||{}).name||''; body=viewRoom(r); right='<button class="ib txt" data-act="editRoom" data-id="'+r.id+'">편집</button>'; }
    else if(top.t==='tenant'){ var t=byId(db.tenants,top.id); if(!t){nav.stack.pop(); return render(true);} title=t.name; sub='세입자 정보'; body=viewTenant(t); right='<button class="ib txt" data-act="editTenant" data-id="'+t.id+'">편집</button>'; }
    else if(top.t==='contract'){ var c=byId(db.contracts,top.id); if(!c){nav.stack.pop(); return render(true);} title='계약 상세'; sub=roomLabel(c); body=viewContract(c); }
    else if(top.t==='props'){ title='건물 관리'; body=viewProps(); fab='<button class="fab" data-act="addProp">＋ 건물 추가</button>'; }
    else if(top.t==='stats'){ title='월별 수입'; sub='실제 입금된 금액 기준'; body=viewStats(); }
    else if(top.t==='backup'){ title='백업 · 복원'; body=viewBackup(); }
    else if(top.t==='bcast'){ title='공지 문자'; sub='입주 중인 세입자 대상'; body=viewBcast(); }
  } else {
    if(nav.tab==='home'){ title='월세 관리'; sub=dayLabel(today()); body=viewHome(); }
    else if(nav.tab==='rooms'){ title='호실'; sub='총 '+db.rooms.length+'개'; body=viewRooms(); fab='<button class="fab" data-act="addRoom">＋ 호실 추가</button>'; }
    else if(nav.tab==='tenants'){ title='세입자'; sub='총 '+db.tenants.length+'명'; body=viewTenants(); fab='<button class="fab" data-act="addTenant">＋ 세입자 추가</button>'; }
    else if(nav.tab==='pay'){ title='납부 내역'; body=viewPay(); }
    else if(nav.tab==='more'){ title='더보기'; body=viewMore(); }
  }
  var back = top? '<button class="ib" data-act="back" aria-label="뒤로">←</button>' : '';
  var tabs = TABS.map(function(x){ return '<button class="'+(!top&&nav.tab===x[0]?'on':'')+'" data-act="tab" data-t="'+x[0]+'">'+ICON[x[2]]+'<span>'+x[1]+'</span></button>'; }).join('');
  app.innerHTML='<header class="top">'+back+'<div class="t"><h1>'+esc(title)+'</h1>'+(sub?'<div class="s">'+esc(sub)+'</div>':'')+'</div>'+right+'</header><main id="main">'+body+'</main>'+fab+'<nav class="tabs">'+tabs+'</nav>';
  var m=document.getElementById('main'); if(m) m.scrollTop=st;
}

/* ───────── 홈 ───────── */
function viewHome(){
  var t=today(), cur=t.slice(0,7), h='';
  if(!db.rooms.length){
    return '<div class="card"><div class="h">처음 시작하기</div><ol class="steps"><li><b>호실 추가</b> – 건물과 호실을 등록해요</li><li><b>입주 계약 등록</b> – 세입자 정보, 월세·관리비, 계약일, 납부일을 입력해요</li><li><b>납부 등록</b> – 월세가 들어오면 납부일을 기록해요</li></ol><div class="btns"><button class="btn" data-act="addRoom">호실 추가하기</button></div></div>'+
      '<div class="banner">입력한 정보는 이 휴대폰 안에만 저장돼요. 앱을 삭제하면 사라지니 <b>더보기 → 백업</b>을 가끔 해두세요.</div>';
  }
  var bill=0,paid=0,cnt=0,done=0;
  db.contracts.forEach(function(c){ if(allMonths(c).indexOf(cur)>=0){ var s=mstat(c,cur); bill+=s.due; paid+=Math.min(s.paid,s.due); cnt++; if(s.k==='paid') done++; } });
  var pct=bill? Math.round(paid/bill*100):0;

  if(ex.length){
    h+='<h2>계약 만기 임박 <span class="chip c-part">'+ex.length+'건</span></h2><div class="card flat">';

function openSheet(html,onMount){
  var bg=document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML='<div class="sheet">'+html+'</div>';
  bg.addEventListener('click',function(e){ if(e.target===bg) closeSheet(); });
  document.body.appendChild(bg); modals.push(bg);
  if(onMount) onMount(bg.firstChild);
  return bg;
}
function closeSheet(){ var m=modals.pop(); if(m) m.remove(); }
function confirmBox(msg,yes,onYes,sub){
  openSheet('<h3>'+esc(msg)+'</h3>'+(sub?'<div class="sub">'+sub+'</div>':'')+'<div class="btns"><button class="btn ghost" data-f="no">취소</button><button class="btn dng" style="flex:1" data-f="yes">'+esc(yes)+'</button></div>',function(sh){
    sh.addEventListener('click',function(e){ var f=e.target.getAttribute&&e.target.getAttribute('data-f'); if(f==='no') closeSheet(); if(f==='yes'){ closeSheet(); onYes(); } });
  });
}
function fieldHtml(f,v){
  var val = v[f.k]!=null? v[f.k] : (f.def!=null? f.def : '');
  var id='f_'+f.k, req=f.req?' <em>*</em>':'', si=f.showIf? ' data-si="'+f.showIf[0]+'='+f.showIf[1]+'"':'';
  var hint=f.hint? '<div class="hint">'+f.hint+'</div>':'';
  if(f.type==='check') return '<label class="fl chk" id="w_'+f.k+'"'+si+'><input type="checkbox" id="'+id+'" '+(val?'checked':'')+'><span>'+f.l+'</span></label>';
  var inner;
  if(f.type==='select') inner='<select id="'+id+'">'+f.opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(String(o[0])===String(val)?' selected':'')+'>'+esc(o[1])+'</option>';}).join('')+'</select>';
  else if(f.type==='textarea') inner='<textarea id="'+id+'" rows="3" placeholder="'+esc(f.ph||'')+'">'+esc(val)+'</textarea>';
  else if(f.type==='money') inner='<input id="'+id+'" data-t="money" inputmode="numeric" placeholder="'+esc(f.ph||'0')+'" value="'+(val===''||val==null?'':Number(val).toLocaleString('ko-KR'))+'">';
  else if(f.type==='tel') inner='<input id="'+id+'" data-t="tel" inputmode="tel" placeholder="010-0000-0000" value="'+esc(val)+'">';
  else if(f.type==='date') inner='<input id="'+id+'" type="date" value="'+esc(val)+'">';
  else inner='<input id="'+id+'" type="text" placeholder="'+esc(f.ph||'')+'" value="'+esc(val)+'">';
  return '<label class="fl" id="w_'+f.k+'"'+si+'><span>'+f.l+req+'</span>'+inner+hint+'</label>';
}
function openForm(o){
  var vals=o.values||{};
  var html='<h3>'+esc(o.title)+'</h3>'+(o.sub?'<div class="sub">'+o.sub+'</div>':'')+(o.pre||'')+o.fields.map(function(f){return fieldHtml(f,vals);}).join('')+
    '<div class="btns">'+(o.onDelete?'<button class="btn dng" data-f="del">'+(o.delLabel||'삭제')+'</button>':'')+'<button class="btn ghost" data-f="cancel">취소</button><button class="btn" data-f="save">'+(o.saveLabel||'저장')+'</button></div>';
  openSheet(html,function(sh){
    function el(k){ return sh.querySelector('#f_'+k); }
    function upd(){ sh.querySelectorAll('[data-si]').forEach(function(w){ var p=w.getAttribute('data-si').split('='); var e=el(p[0]); w.classList.toggle('hidden', !(e && e.value===p[1])); }); }
    function read(){
      var out={};
      for(var i=0;i<o.fields.length;i++){
        var f=o.fields[i], e=el(f.k), w=sh.querySelector('#w_'+f.k), hid=w&&w.classList.contains('hidden');
        var v;
        if(f.type==='check') v=e.checked; else if(f.type==='money') v=parseInt(digits(e.value)||'0',10); else v=e.value.trim();
        if(f.req && !hid && (v===''||(f.type==='money'&&!v&&f.reqPos))){ toast(f.l+'을(를) 입력해 주세요'); e.focus(); return null; }
        out[f.k]=hid && f.showIf ? (f.type==='money'?0:'') : v;
      }
      return out;
    }
    sh.addEventListener('change',function(e){ upd(); if(o.onChange) o.onChange(e,el); });
    sh.addEventListener('click',function(e){
      var fn=e.target.getAttribute&&e.target.getAttribute('data-f');
      if(fn==='cancel') closeSheet();
      else if(fn==='save'){ var r=read(); if(!r) return; if(o.onSave(r)!==false) closeSheet(); }
      else if(fn==='del'){ o.onDelete(); }
    });
    upd();
  });
}
document.addEventListener('input',function(e){
  var t=e.target; if(!t||!t.dataset) return;
  if(t.dataset.t==='money'){ var d=digits(t.value); t.value=d? Number(d).toLocaleString('ko-KR'):''; }
  else if(t.dataset.t==='tel'){ t.value=fmtPhone(t.value); }
  else if(t.id==='q'){ var q=t.value.trim().toLowerCase(); document.querySelectorAll('#tlist [data-s]').forEach(function(r){ r.classList.toggle('hidden', q && r.getAttribute('data-s').indexOf(q)<0); }); }
});

  var t=id? byId(db.tenants,id) : null;
  openForm({title:t?'세입자 수정':'세입자 추가',values:t||{},fields:TFIELDS,
    onSave:function(v){ if(t) Object.assign(t,v); else db.tenants.push(Object.assign({id:uid(),notes:[]},v)); save(); render(); toast('저장했어요'); },
    onDelete:t? function(){
      if(db.contracts.some(function(c){return c.tenantId===t.id;})){ toast('계약 이력이 있는 세입자는 삭제할 수 없어요'); return; }
      closeSheet(); db.tenants=db.tenants.filter(function(x){return x!==t;}); save(); nav.stack=[]; render(true); toast('삭제했어요'); } : null});
}
function payDayOpts(){ var o=[]; for(var i=1;i<=31;i++) o.push([String(i),'매월 '+i+'일']); return o; }
function contractForm(pre,cid){
  var c=cid? byId(db.contracts,cid) : null;
  var roomId=c? c.roomId : pre.roomId;
  var tens=db.tenants.slice().sort(function(a,b){return natcmp(a.name,b.name);});
  var tOpts=[['new','＋ 새 세입자 등록']].concat(tens.map(function(t){return [t.id,t.name+(t.phone?' ('+t.phone+')':'')];}));
  var t0=today();
  var vals=c? Object.assign({},c,{payDay:String(c.payDay)}) : {tenantId:pre.tenantId||(tens.length?'new':'new'),start:t0,end:yearLater(t0),payDay:String(pd(t0).getDate())};
  if(!c && pre.tenantId) vals.tenantId=pre.tenantId;
  var fields=[
    {k:'tenantId',l:'세입자',type:'select',opts:tOpts},
    {k:'nName',l:'새 세입자 이름',req:1,showIf:['tenantId','new']},
    {k:'nPhone',l:'전화번호',type:'tel',showIf:['tenantId','new']},
    {k:'nGuardian',l:'보호자 이름',showIf:['tenantId','new']},
    {k:'nGuardianPhone',l:'보호자 전화번호',type:'tel',showIf:['tenantId','new']},
    {k:'deposit',l:'보증금 (원)',type:'money'},
    {k:'rent',l:'월세 (원)',type:'money',req:1},
    {k:'fee',l:'관리비 (원)',type:'money'},
    {k:'start',l:'계약일 (입주 시작)',type:'date',req:1},
    {k:'end',l:'계약 만기일',type:'date',req:1},
    {k:'payDay',l:'월세 납부일',type:'select',opts:payDayOpts()},
    {k:'agency',l:'부동산(중개사무소)',ph:'상호 / 담당자'},
    {k:'agencyTel',l:'부동산 전화번호',type:'tel'},
    {k:'memo',l:'비고 (계약 관련)',type:'textarea',ph:'특약사항, 입금자명 등'}];
  if(c && c.status==='ended') fields.push({k:'depositReturned',l:'보증금 반환 완료',type:'check'});
  var endTouched=!!c, dayTouched=!!c;
  openForm({title:c?'계약 수정':'입주 계약 등록',sub:esc((byId(db.rooms,roomId)||{}).name||'')+' 호실',values:vals,fields:fields,
    onChange:function(e,el){
      var id=e.target.id;
      if(id==='f_end') endTouched=true;
      if(id==='f_payDay') dayTouched=true;
      if(id==='f_start' && e.target.value){
        if(!endTouched) el('end').value=yearLater(e.target.value);
        if(!dayTouched) el('payDay').value=String(pd(e.target.value).getDate());
      }
    },
    onSave:function(v){
      if(v.end<v.start){ toast('만기일이 계약일보다 빨라요'); return false; }
      var tid=v.tenantId;
      if(tid==='new'){
        var nt={id:uid(),name:v.nName,phone:v.nPhone,guardian:v.nGuardian,guardianPhone:v.nGuardianPhone,notes:[]};
        db.tenants.push(nt); tid=nt.id;
      }
      var data={tenantId:tid,deposit:v.deposit,rent:v.rent,fee:v.fee,start:v.start,end:v.end,payDay:Number(v.payDay),agency:v.agency,agencyTel:v.agencyTel,memo:v.memo};
      if(c){ Object.assign(c,data); if(c.status==='ended') c.depositReturned=!!v.depositReturned; }
      else { if(activeOf(roomId)){ toast('이미 입주 중인 계약이 있어요'); return false; } db.contracts.push(Object.assign({id:uid(),roomId:roomId,status:'active',endedOn:null,depositReturned:false},data)); }
      save(); render(); toast('저장했어요');
    },
    onDelete:c? function(){ closeSheet(); confirmBox('이 계약을 삭제할까요?','삭제',function(){
      db.payments=db.payments.filter(function(p){return p.contractId!==c.id;});
      db.contracts=db.contracts.filter(function(x){return x!==c;});
      save(); nav.stack=nav.stack.filter(function(s){return !(s.t==='contract'&&s.id===c.id);}); render(true); toast('삭제했어요'); },'이 계약의 납부 기록도 함께 삭제돼요.'); } : null});
}
function endForm(c){
  openForm({title:'퇴실 처리',sub:'퇴실일 이후의 월세는 청구되지 않아요.',values:{endedOn:today(),depositReturned:false},fields:[
    {k:'endedOn',l:'퇴실일',type:'date',req:1},
    {k:'depositReturned',l:'보증금 반환 완료',type:'check'}],saveLabel:'퇴실 처리',
    onSave:function(v){ c.status='ended'; c.endedOn=v.endedOn; c.depositReturned=!!v.depositReturned; save(); render(); toast('퇴실 처리했어요'); }});
}
function renewForm(c){
  var ns=addD(c.end,1);
  openForm({title:'계약 갱신',sub:'기존 계약은 "갱신됨"으로 보관되고, 새 계약이 만들어져요.',values:{start:ns,end:yearLater(ns),deposit:c.deposit,rent:lastTerms(c).rent,fee:lastTerms(c).fee},fields:[
    {k:'start',l:'새 계약 시작일',type:'date',req:1},
    {k:'end',l:'새 계약 만기일',type:'date',req:1},
    {k:'deposit',l:'보증금 (원)',type:'money'},
    {k:'rent',l:'월세 (원)',type:'money',req:1},
    {k:'fee',l:'관리비 (원)',type:'money'}],saveLabel:'갱신',
    onChange:function(e,el){ if(e.target.id==='f_start' && e.target.value) el('end').value=yearLater(e.target.value); },
    onSave:function(v){
      if(v.end<v.start){ toast('만기일이 시작일보다 빨라요'); return false; }
      c.status='renewed'; c.endedOn=c.end;
      db.contracts.push({id:uid(),roomId:c.roomId,tenantId:c.tenantId,status:'active',endedOn:null,depositReturned:false,deposit:v.deposit,rent:v.rent,fee:v.fee,start:v.start,end:v.end,payDay:c.payDay,agency:c.agency,agencyTel:c.agencyTel,memo:c.memo});
      save(); render(); toast('갱신했어요'); }});
}
function openPay(cid,ym){
  var c=byId(db.contracts,cid); if(!c) return;
  var s=mstat(c,ym), pays=payFor(c,ym), t=byId(db.tenants,c.tenantId)||{}, r=byId(db.rooms,c.roomId)||{};
  var pre='<div class="sub">'+esc(t.name||'')+' · '+ymLabel(ym)+' 월세 · 납부일 '+kd(s.dd)+'</div>'+
    '<div class="card" style="margin:12px 0 4px"><div class="kv"><span>청구 금액</span><span>'+won(s.due)+' <span class="sub">(월세 '+won(s.rent)+(s.fee?' + 관리비 '+won(s.fee):'')+')</span></span></div><div class="kv"><span>입금 합계</span><span>'+won(s.paid)+'</span></div><div class="kv"><span>남은 금액</span><span><b style="color:'+(s.remain?'var(--red)':'var(--pri)')+'">'+won(s.remain)+'</b></span></div></div>'+
    (pays.length? '<div class="sub" style="margin-top:12px;font-weight:700">입금 내역</div>'+pays.map(function(p){ return '<div class="row" style="padding:8px 0"><div class="grow"><b>'+kd(p.paidOn)+'</b><div class="sub">'+esc(p.memo||'')+'</div></div><b>'+won(p.amount)+'</b><button class="ib sm" data-act="delPay" data-id="'+p.id+'" data-c="'+cid+'" data-ym="'+ym+'">✕</button></div>'; }).join('') : '');
  openForm({title:esc(r.name||'')+' 납부 등록',pre:pre,values:{paidOn:today(),amount:s.remain||''},fields:[
    {k:'paidOn',l:'납부(입금)한 날짜',type:'date',req:1},
    {k:'amount',l:'입금 금액 (원)',type:'money',req:1,reqPos:1},
    {k:'memo',l:'메모',ph:'예: 계좌이체, 현금, 입금자명'}],saveLabel:pays.length?'추가 입금 등록':'납부 등록',
    onSave:function(v){ db.payments.push({id:uid(),contractId:cid,ym:ym,paidOn:v.paidOn,amount:v.amount,memo:v.memo}); save(); render(); toast('납부를 등록했어요'); }});
}
function noteForm(kind,id,nid){
  var owner=byId(kind==='room'?db.rooms:db.tenants,id); if(!owner) return;
  var n=(owner.notes||[]).filter(function(x){return x.id===nid;})[0]; if(!n) return;
  openForm({title:'기록 수정',values:n,fields:[{k:'date',l:'날짜',type:'date',req:1},{k:'text',l:'내용',type:'textarea',req:1}],
    onSave:function(v){ n.date=v.date; n.text=v.text; save(); render(); },
    onDelete:function(){ closeSheet(); owner.notes=owner.notes.filter(function(x){return x!==n;}); save(); render(); toast('삭제했어요'); }});
}

/* ───────── 동작 ───────── */
var acts={
  tab:function(d){ setTab(d.t); },
  back:function(){ window.__back(); },
  room:function(d){ go({t:'room',id:d.id}); },
  tenant:function(d){ if(d.id) go({t:'tenant',id:d.id}); },
  contract:function(d){ go({t:'contract',id:d.id}); },
  props:function(){ go({t:'props'}); },
  stats:function(){ go({t:'stats'}); },
  backup:function(){ go({t:'backup'}); },
  addRoom:function(){ roomForm(); },
  editRoom:function(d){ roomForm(d.id); },
  addTenant:function(){ tenantForm(); },
  editTenant:function(d){ tenantForm(d.id); },
  addProp:function(){ propForm(); },
  editProp:function(d){ propForm(d.id); },
  newContract:function(d){ contractForm({roomId:d.room}); },
  editContract:function(d){ contractForm(null,d.id); },
  chgTerms:function(d){ termsForm(byId(db.contracts,d.id)); },
  delChg:function(d){ var c=byId(db.contracts,d.id); confirmBox(ymLabel(d.from)+'부터의 금액 변경을 삭제할까요?','삭제',function(){ c.changes=(c.changes||[]).filter(function(x){return x.from!==d.from;}); save(); render(); toast('삭제했어요'); },'삭제하면 그 달부터 이전 금액으로 청구돼요.'); },
  renew:function(d){ renewForm(byId(db.contracts,d.id)); },
  endC:function(d){ endForm(byId(db.contracts,d.id)); },
  reopen:function(d){ var c=byId(db.contracts,d.id); if(activeOf(c.roomId)){ toast('이미 입주 중인 계약이 있어요'); return; } c.status='active'; c.endedOn=null; save(); render(); toast('계약을 다시 시작했어요'); },
  pay:function(d){ openPay(d.c,d.ym); },
  delPay:function(d){ confirmBox('이 입금 내역을 삭제할까요?','삭제',function(){ db.payments=db.payments.filter(function(p){return p.id!==d.id;}); save(); closeSheet(); render(); openPay(d.c,d.ym); }); },
  addNote:function(d){
    var ta=document.getElementById('nt_'+d.k); var v=ta&&ta.value.trim(); if(!v){ toast('내용을 입력해 주세요'); return; }
    var o=byId(d.k==='room'?db.rooms:db.tenants,d.id); if(!o.notes) o.notes=[];
    o.notes.push({id:uid(),date:today(),text:v}); save(); render(); toast('기록을 추가했어요');
  },
  editNote:function(d){ noteForm(d.k,d.id,d.n); },
  call:function(d){ openUri('tel:'+digits(d.n)); },
  sms:function(d){ openUri('sms:'+digits(d.n)); },
  smsLate:function(d){
    var c=byId(db.contracts,d.c), t=byId(db.tenants,c.tenantId)||{}, r=byId(db.rooms,c.roomId)||{}, p=byId(db.props,r.propId)||{};
    var s=mstat(c,d.ym);
    var body='['+(p.name?p.name+' ':'')+r.name+'] '+t.name+'님, '+ymLabel(d.ym)+' 월세 '+won(s.remain)+'이 아직 확인되지 않았습니다. 확인 부탁드립니다.'+(p.account?' 입금계좌: '+p.account:'');
    openUri('sms:'+digits(t.phone)+'?body='+encodeURIComponent(body));
  },
  bcast:function(){ go({t:'bcast'}); },
  bcProp:function(d){ bc.prop=d.p; render(); },
  bcTpl:function(d){ var ta=document.getElementById('bc_body'); if(ta) bc.body=ta.value; var i=Number(d.i); if(bc.body.trim()){ confirmBox('작성 중인 내용을 템플릿으로 바꿀까요?','바꾸기',function(){ bc.body=BC_TPL[i][1]; render(); }); return; } bc.body=BC_TPL[i][1]; render(); },
  bcTog:function(d){ bc.sel[d.id]=!bc.sel[d.id]; render(); },
  bcAll:function(d){ bcList().forEach(function(x){ bc.sel[x.id]=d.v==='1'; }); render(); },
  bcReset:function(){ bc.sent={}; render(); },
  bcSendOne:function(d){
    var ta=document.getElementById('bc_body'); if(ta) bc.body=ta.value;
    var x=bcList().filter(function(y){return y.id===d.id;})[0]; if(!x) return; if(!bc.body.trim()){ toast('보낼 내용을 입력해 주세요'); return; }
    bc.sent[x.id]=true;
    openUri('sms:'+x.phone+'?body='+encodeURIComponent(bcText(bc.body,x)));
    setTimeout(function(){ render(); },300);
  },
  mon:function(d){ pf.ym=addM(pf.ym,Number(d.n)); render(true); },
  yr:function(d){ pf.year+=Number(d.n); render(true); },
  pfilter:function(d){ pf.filter=d.f; render(); },
  doShare:function(){ var j=backupJson(); db.meta.lastBackup=new Date().toISOString(); save(); if(A&&A.share){ A.share(j); } else { copyText(j); toast('브라우저에서는 복사만 돼요'); } render(); },
  doCopy:function(){ var j=backupJson(); if(copyText(j)){ db.meta.lastBackup=new Date().toISOString(); save(); toast('백업 내용을 복사했어요. 메모나 메신저에 붙여넣어 보관하세요'); render(); } else toast('복사에 실패했어요. "공유로 내보내기"를 이용해 주세요'); },
  doRestore:function(){
    var ta=document.getElementById('rest'); var txt=ta&&ta.value.trim(); if(!txt){ toast('백업 내용을 붙여넣어 주세요'); return; }
    var d; try{ d=JSON.parse(txt); }catch(e){ toast('백업 형식이 올바르지 않아요'); return; }
    var data=d&&d.data? d.data : d;
    if(!data||!Array.isArray(data.rooms)||!Array.isArray(data.contracts)||!Array.isArray(data.payments)||!Array.isArray(data.tenants)){ toast('백업 형식이 올바르지 않아요'); return; }
    confirmBox('현재 데이터를 백업 내용으로 바꿀까요?','복원',function(){ db=Object.assign(blank(),data); if(!db.meta) db.meta={}; save(); nav.stack=[]; nav.tab='home'; render(true); toast('복원했어요'); },'지금 저장된 데이터는 사라져요.');
  },
  doWipe:function(){ confirmBox('모든 데이터를 삭제할까요?','전체 삭제',function(){ confirmBox('정말 삭제할까요? 되돌릴 수 없어요.','네, 삭제합니다',function(){ db=blank(); save(); nav.stack=[]; nav.tab='home'; render(true); toast('삭제했어요'); }); },'백업하지 않았다면 복구할 수 없어요.'); }
};
document.addEventListener('click',function(e){
  var el=e.target.closest&&e.target.closest('[data-act]'); if(!el) return;
  var fn=acts[el.getAttribute('data-act')]; if(!fn) return;
  e.stopPropagation();
  fn(el.dataset,el);
});

/* ───────── 뒤로가기 ───────── */
var lastBack=0;
window.__back=function(){
  if(modals.length){ closeSheet(); return; }
  if(nav.stack.length){ nav.stack.pop(); render(true); return; }
  if(nav.tab!=='home'){ setTab('home'); return; }
  var now=Date.now();
  if(now-lastBack<2000){ if(A&&A.exit) A.exit(); return; }
  lastBack=now; toast('한 번 더 누르면 종료돼요');
};
window.__rent={get db(){return db;},set db(v){db=v;save();render(true);},render:render,acts:acts};
render(true);
})();
</script>
