name: Emulator test

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build release APK
        run: ./build.sh
      - name: Build test APK (adds a PICK button that opens the file chooser)
        run: |
          rm -rf /tmp/testapp && mkdir /tmp/testapp
          cp -r . /tmp/testapp/ && cd /tmp/testapp && rm -rf out build
          python3 - <<'PY'
          p='assets/index.html'; s=open(p,encoding='utf-8').read()
          inj = """<div id="__tb" style="position:fixed;top:0;left:0;right:0;height:60vh;z-index:99999;background:#ff0;font-size:28px;padding:20px">PICK (tap here)<br><span id="__tr">idle</span></div><script>document.getElementById('__tb').onclick=function(){var i=document.createElement('input');i.type='file';i.accept='image/*';i.style.display='none';document.body.appendChild(i);i.onchange=function(){var f=i.files[0];if(f&&f.name==='test.png'&&f.size>0&&window.Android&&Android.share){Android.share('GOT:'+f.name+':'+f.size);}};i.click();};</script></body>"""
          assert '</body>' in s
          open(p,'w',encoding='utf-8').write(s.replace('</body>',inj,1))
          PY
          ./build.sh
          mkdir -p "$GITHUB_WORKSPACE/out-test" && cp -r out/signed "$GITHUB_WORKSPACE/out-test/"
      - name: Free disk space (emulator needs ~7GB for userdata)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk /usr/local/share/powershell /usr/share/swift || true
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash test/emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results
          path: emu-out/
